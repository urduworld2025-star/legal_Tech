# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploys two services: the FastAPI backend (with a persistent disk for the
# SQLite database) and the React frontend as a static site.
#
# Before using this:
#   1. Push your two trained model checkpoints to your own Hugging Face Hub
#      repos - see scripts/upload_models_to_hub.py. If those repos are
#      private (the default is public; use --private to make them private),
#      the backend needs HF_TOKEN below to access them.
#   2. In the Render dashboard, go to "New" -> "Blueprint", point it at this
#      repo. Render will read this file and let you review both services
#      before creating them.
#   3. The backend service defaults to Render's free plan, which has 512MB
#      RAM - not enough to hold two transformer models + PyTorch at once.
#      After the first deploy, go to the backend service's Settings and
#      upgrade its plan to one with at least ~2GB RAM.
#   4. Fill in the env vars marked `sync: false` below via the Render
#      dashboard (Environment tab) - they're deliberately not in this file
#      since they're secrets or deployment-specific values.

services:
  - type: web
    name: legalintel-api
    runtime: python
    buildCommand: >-
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: legalintel-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/legalintel.db
      - key: JWT_SECRET_KEY
        sync: false # generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: COURTLISTENER_API_TOKEN
        sync: false # https://www.courtlistener.com/profile/api-token/
      - key: CLAUSE_MODEL_DIR
        sync: false # e.g. yourname/clause-extraction-baseline (see scripts/upload_models_to_hub.py)
      - key: DOCUMENT_CLASSIFICATION_MODEL_DIR
        sync: false # e.g. yourname/document-classification-baseline
      - key: HF_TOKEN
        sync: false # only needed if the two repos above are private - a "read" token is enough
      - key: CORS_ALLOW_ORIGINS
        sync: false # JSON list, e.g. ["https://legalintel-frontend.onrender.com"] - set after the frontend service exists
      - key: STRIPE_SECRET_KEY
        sync: false # optional - see README's "Billing (Stripe)" section; billing routes 503 if unset
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false # set to the legalintel-frontend service's URL once it exists

  - type: web
    name: legalintel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the legalintel-api service's URL, e.g. https://legalintel-api.onrender.com
    routes:
      # Client-side routing (react-router-dom) - any path not matching a real
      # static file must still serve index.html, or refreshing a route like
      # /matters/5 would 404.
      - type: rewrite
        source: /*
        destination: /index.html
